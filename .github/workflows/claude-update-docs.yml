# Analyze merged PRs and suggest documentation updates
# Creates new issue & instructs Claude assistant to create PR
name: Claude Update Docs

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  claude-update-docs:
    # Only run when PR is actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Documentation Analysis
        uses: anthropics/claude-code-action@58dbe8ed6879f0d3b02ac295b20d5fdfe7733e0c # v1.0.85
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ## Role
            A pull request has just been merged to master. Your task is to analyze the changes and determine if any documentation needs to be updated.

            ## Context
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR BODY: ${{ github.event.pull_request.body }}
            AUTHOR: ${{ github.event.pull_request.user.login }}
            MERGE COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

            ## Task
            1. First, get the diff of the merged PR:
               `gh pr diff ${{ github.event.pull_request.number }}`

            2. Review the changes and identify:
               - New features or functionality added
               - API changes or new endpoints
               - Configuration changes
               - Breaking changes
               - New dependencies
               - Changes to installation/setup process
               - Changes to usage patterns
               - etc.

            3. Check the following documentation files for potential updates needed:
               - README.md (project overview, installation, usage)
               - AGENTS.md (AI agent instructions and context)
               - CONTRIBUTING.md (contribution guidelines)
               - KNOWN_ISSUES.md (known issues, FAQ)
               - SECURITY.md (security best practices)
               - docs/* (tutorials, guides, API docs)

               Known tight source ↔ doc contracts (treat each as a single staleness signal):

               (a) `src/aetherscan/cli.py` ↔ README.md's `## CLI Reference` section.
                   The three code blocks under that section (### Top-Level Help,
                   ### Train Command Help, ### Inference Command Help) are pasted
                   verbatim argparse output. If `cli.py` changed in this PR — flags
                   added/removed/renamed, help strings edited, subparsers added or
                   dropped — those blocks have almost certainly drifted. The follow-up
                   PR must regenerate them by running, from the repo root:

                       PYTHONPATH=src python utils/print_cli_help.py all

                   The script (utils/print_cli_help.py) does not require TensorFlow
                   or the conda env — it imports only aetherscan.config and
                   aetherscan.cli, both pure-stdlib modules. It pins COLUMNS=80 so
                   line wrapping is deterministic. The output is three blocks
                   separated by blank lines: top-level, then train, then inference.
                   Each block goes verbatim into the matching `### ... Help` code
                   block in README.md. Preserve each subsection's intro paragraph
                   (which contains the "Regenerate this output with ..." hint).

            4. If documentation updates are needed:
               - First check for existing documentation issues to avoid duplicates:
                 `gh issue list --label "documentation" --state open`
               - If no existing issue covers the same updates, create a new GitHub issue with the label "documentation"
               - Title: "[DOCUMENTATION]: <brief description>"
               - Body should include:
                 - Reference to the merged PR (#${{ github.event.pull_request.number }})
                 - Summary of changes that require documentation
                 - Specific files that need updates
                 - Suggested changes or additions
                 - Tag @claude with instructions to open a PR linking to this issue with the specified updates
                 - If the changes touched `src/aetherscan/cli.py`, include the exact
                   regen recipe in the issue body so the follow-up PR has a
                   deterministic command to run:
                       PYTHONPATH=src python utils/print_cli_help.py all
                   …and explicitly instruct the follow-up to replace each of the
                   three code blocks under README.md's `## CLI Reference` section
                   verbatim with the matching output (top → ### Top-Level Help,
                   train → ### Train Command Help, inference → ### Inference
                   Command Help), keeping each subsection's intro paragraph intact.

            5. If no documentation updates are needed, do not create an issue.
               Only create an issue if there are meaningful documentation gaps.

            ## Available tools
            PR inspection:
            - `gh pr diff` to retrieve the merged PR's diff (the primary signal for what to analyze in Step 1)
            - `gh pr view` to look up additional PR metadata (labels, comments, reviewers) if needed beyond the variables interpolated above

            Issue interaction:
            - `gh issue list --label "documentation" --state open` to check for an already-open documentation issue before filing a new one (Step 4 duplicate guard)
            - `gh issue create` to file a new `[DOCUMENTATION]: <…>` issue tagging @claude when meaningful doc gaps are identified

            Code exploration:
            - `Read`, `Glob`, `Grep` to inspect README.md, AGENTS.md, CONTRIBUTING.md, KNOWN_ISSUES.md, SECURITY.md, docs/*, and any source files referenced by the cli.py ↔ README contract above

            ## Guidelines
            - Be specific about what documentation changes are required.
            - Your only responsibilities are to determine whether any documentation needs to be updated after the merged PR. Do not do anything that is not within this job scope.

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue create:*),Read,Glob,Grep"
            --model opus
