# Auto triage & label every new issue
name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  claude-issue-triage:
    runs-on: ubuntu-latest
    # Timeout implemented after run 21642589782 failed due to Claude going down a rabbit hole
    # Issue triage shouldn't take more than 5 mins (refine if data shows otherwise)
    # If Claude continues going down rabbit holes, consider refining the prompt to be more focused
    # See: https://github.com/zachtheyek/Aetherscan/actions/runs/21642589782/job/62386093601
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@6c61301d8e1ee91bef7b65172f93462bbb216394 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY: ${{ github.event.issue.body }}
            AUTHOR: ${{ github.event.issue.user.login }}

            Analyze this new issue and:
            1. Determine if it's a bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Suggest appropriate labels
            4. Check if it duplicates existing issues

            Based on your analysis, add the appropriate labels using:
            `gh issue edit [number] --add-label "label1,label2"`

            If it appears to be a duplicate, post a comment mentioning the original issue.

            Your only responsibilities are to triage the current issue. Do not do anything that is not within this job scope.

          claude_args: |
            --allowedTools "Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*),Read,Glob,Grep"
            --model opus
