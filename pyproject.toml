# Packaging + release process: docs/RELEASE.md (version coupling, CD gates, runbook).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherscan"]

[project]
name = "aetherscan"
# Single source of truth for the package version (src/aetherscan/__init__.py reads it back
# via importlib.metadata). Kept a pre-release between releases; the release PR bumps it to
# the final X.Y.Z, and the CD workflow (.github/workflows/release.yml) enforces that the
# pushed git tag matches it exactly.
version = "1.1.0"
authors = [
    { name = "Zach Yek", email = "xiaoxiyek1.5@gmail.com" },
]
maintainers = [
    { name = "Zach Yek", email = "xiaoxiyek1.5@gmail.com" },
]
description = "Breakthrough Listen's first end-to-end production-grade DL pipeline for SETI @ scale"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Mirrors requirements-container.txt's ranges for the packaged runtime — keep them (and
    # environment.yml / aetherscan.def / Dockerfile) in lockstep per SECURITY.md's Version Selection Policy.
    # Documented ceilings (numpy<2.0, setuptools<81, the NGC TF 2.17 ABI) apply to the package
    # exactly as to the container. The dashboard stack (streamlit/plotly/pandas) lives in the
    # optional `dashboard` extra below — not core deps — so a bare install stays lean while
    # `pip install aetherscan[dashboard]` still gets the packaged dashboard (aetherscan/dashboard.py).
    "numpy>=1.26,<2.0",
    "scipy>=1.13,<1.14",
    "scikit-learn>=1.5,<1.6",
    "matplotlib>=3.9,<3.10",
    "astropy>=6.1,<7",
    "scikit-image>=0.24,<0.25",
    "joblib>=1.4,<2",
    "imageio>=2.34,<3",
    "umap-learn>=0.5.6,<0.6",
    "shap>=0.46.0,<0.47",
    "slack-sdk>=3.31.0,<4",
    # Floor >=1.2.2 per GHSA-mf9w-mj56-hr94 (CVE-2026-28684; fixed in 1.2.2).
    "python-dotenv>=1.2.2,<2",
    "huggingface_hub>=1.22,<1.23",
    # setuptools provides pkg_resources, which blimpy (transitive via setigen) imports at
    # module load; <81 because setuptools 81 removed the vendored pkg_resources.
    # Floor >=78.1.1 per GHSA-5rjg-fvgr-3xxf (CVE-2025-47273; fixed in 78.1.1).
    "setuptools>=78.1.1,<81",
    "setigen>=2.6,<3",
    # The NGC base image provides these implicitly (so requirements-container.txt omits
    # them); a pip install has no base image to lean on and must declare them. Ranges
    # mirror environment.yml's pins.
    "tensorflow[and-cuda]==2.17.*",
    # tf_keras backs legacy-Keras mode (TF_USE_LEGACY_KERAS, set in aetherscan/__init__.py):
    # the v1.0.0 .keras weights are Keras-2 format, so a bare pip install must pull it (#323).
    "tf_keras==2.17.*",
    "h5py>=3.11,<3.12",
    "hdf5plugin",
    "psutil>=6.0,<6.1",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "SETI",
    "Technosignatures",
    "Radio Astronomy",
    "Signal Processing",
    "Anomaly Detection",
    "Machine Learning",
    "Deep Learning",
    "Data Methods",
]
classifiers = [
    # Revisit in every release PR per docs/RELEASE.md. v1.0.0 ships blessed release weights +
    # a stable CLI/config contract, so: Production/Stable. Re-affirmed for v1.1.0 (same
    # weights re-blessed, contract intact).
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Unix",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    # NOTE: the NGC 25.02 container runs CUDA 12.8, but the trove classifier list currently
    # tops out at "12 :: 12.6" — the bare ":: 12" parent is the closest valid classifier
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/zachtheyek/Aetherscan"
Issues = "https://github.com/zachtheyek/Aetherscan/issues"

[project.scripts]
# Manual dashboard runs against a saved DB (main.py auto-launches it during a run). Re-execs
# `python -m streamlit run <packaged dashboard.py>` because streamlit must own the process —
# a plain `python -m aetherscan.dashboard` renders nothing. Needs the `dashboard` extra.
aetherscan-dashboard = "aetherscan.dashboard_cli:main"

[project.optional-dependencies]
dev = ["ruff", "pre-commit", "pytest>=9.0.3"]
# Live monitoring dashboard (aetherscan/dashboard.py, auto-launched by main.py). Opt-in extra so a
# bare `pip install aetherscan` stays lean; `pip install aetherscan[dashboard]` pulls the stack.
# Ranges mirror requirements-container.txt / environment.yml (kept in lockstep); streamlit 1.54
# coexists with TF 2.17's protobuf 4.x and numpy<2, plotly is pure-Python, pandas backs the data
# layer (the NGC base ships pandas, so requirements-container.txt omits it there).
dashboard = ["streamlit>=1.54.0,<1.55", "plotly>=5.24,<6", "pandas>=2.0,<3"]

[tool.pytest.ini_options]
# Make `import aetherscan` work without a PYTHONPATH=src prefix
pythonpath = ["src"]
testpaths = ["tests"]
# Reject undeclared markers so a typo'd @pytest.mark.gpu can't silently slip into CI
addopts = "--strict-markers"
markers = [
    "slow: slower tests (e.g. builds TF graphs on CPU); included in the default CI selection",
    "gpu: requires one or more physical GPUs; excluded from CI",
    "cluster: requires cluster-resident data/models (blpc3/bla0); excluded from CI",
    "integration: end-to-end pipeline runs; skips the per-test singleton/env isolation fixture in `conftest.py`",
]

[tool.ruff]
# Configure linter
target-version = "py310"   # Target Python version
line-length = 100          # Set maximum line length

# Exclude directories from linting
exclude = [  # TODO: partially sync with .gitignore (local & global)
    ".claude",
    ".git",
    ".ipynb_checkpoints",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "outputs",
]

[tool.ruff.lint]
# Enable specific linting rules
select = [
    "E",     # Standard PEP 8 formatting errors (indentation, whitespace, etc.)
    "W",     # Standard PEP 8 formatting warnings (indentation, whitespace, etc.)
    "F",     # Detects unused imports, variables, etc.
    "I",     # Checks import order consistency
    "N",     # Enforces naming conventions (functions_names vs FunctionNames, etc.)
    "UP",    # Suggests modern syntax upgrades (f-strings, type hints, etc.)
    "B",     # Find common bugs and design patterns
    "C4",    # Simplifies inefficient comprehensions (list, set, dict)
    "SIM",   # Simplifies control flow (if/else, return, etc.)
    "PL",    # Logical and stylistic checks
    "G001",  # Logging cannot use str.format() (use f-strings instead)
    "G002",  # Logging cannot use %-formatting (use f-strings instead)
    "G003",  # Logging cannot use + concatenation (use f-strings instead)
    "T20",   # No bare print()/pprint()
]

# Ignore specific linting rules
ignore = [
    "E501",     # Defer line wrapping to formatter
    "F841",     # Allow unused variables
    "PLR0913",  # Allow functions with many params
    "PLR2004",  # Ignore warnings for magic number comparisons

    # NOTE: temporary ignores
    "N999",     # Invalid module name (remove once Aetherscan -> aetherscan)
    "PLW0603",  # Discourage updating state with global variables (find a way to fix)
    "PLR0911",  # Function has too many return statements (>6)
    "PLR0912",  # Function has too many branches (if/elif/else, loops, etc.) (>12)
    "PLR0915",  # Function has too many statements (>50)
]

fixable = ["ALL"]  # Allow autofix for all enabled rules when possible
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"utils/*" = ["T20"]  # Allow utility scripts to use print()
"benchmarks/*" = ["T20"]  # Allow micro-benchmark scripts to use print()
"src/aetherscan/logger/slack_handler.py" = ["T201"]  # Allow logging handler to use print() (for stderr; handler can't log through itself without recursion)

[tool.ruff.lint.isort]
# Declare first-party imports (for sorting order)
known-first-party = ["aetherscan"]
# Require the modern-typing future import atop every module (I002, auto-fixed)
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
# Configure formatter
quote-style = "double"  # Use double quotes for strings
indent-style = "space"  # Indent with spaces
line-ending = "auto"    # Use system-default line endings
