# Ampere cluster conda environment
# Version ranges should be kept in lockstep with NGC TF 25.02 container that targets
# the Blackwell cluster (see aetherscan.def + requirements-container.txt)

name: aetherscan
channels:
  - conda-forge
  - defaults
  - nvidia
dependencies:
  - python=3.10
  - numpy=1.26.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - scikit-image=0.24.*
  - astropy=6.1.*
  - matplotlib=3.9.*
  - joblib=1.4.*
  - h5py=3.11.*
  - hdf5plugin
  - psutil=6.0.*
  - pytest=8.2.*
  - ipykernel
  - nvidia::cuda-runtime=12.5.*
  - cudnn=9.3.*
  - pip
  - pip:
      - tensorflow==2.17.*
      - setigen
      - imageio>=2.34.0,<3
      - umap-learn>=0.5.6,<0.6
      - shap>=0.46.0,<0.47
      - slack-sdk>=3.31.0,<4
      - python-dotenv>=1.0,<2
