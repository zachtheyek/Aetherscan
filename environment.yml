# Ampere cluster conda environment (alternative install path).
#
# The canonical runtime on BOTH Ampere and Blackwell is the NGC 25.02 container
# (see aetherscan.def). This conda env is kept as an alternative for users who
# can't or don't want to use containers on Ampere -- it gets feature parity at
# the application level but uses a different CUDA stack underneath (see below).
#
# Version ranges should be kept in lockstep with the NGC TF 25.02 container
# (see aetherscan.def + requirements-container.txt).
#
# CUDA / cuDNN / NCCL come from the tensorflow[and-cuda] pip extra rather than
# conda packages. The TF 2.17 wheel is ABI-tied to a specific CUDA stack
# (CUDA 12.3 runtime, cuDNN 9.1, NCCL 2.21.5) -- mixing in newer conda-forge
# versions (e.g. cuda-runtime=12.5 / cudnn=9.3) causes TF to silently fail GPU
# detection and fall back to CPU. Letting pip resolve the matching nvidia-*
# wheels via [and-cuda] guarantees a working stack and matches the wheel
# Aetherscan is tested against in CI.

name: aetherscan
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Foundational deps -- pin ranges identically to requirements-container.txt
  # so the conda env and the NGC container resolve to the same versions of
  # everything aetherscan code touches directly.
  - numpy>=1.26,<2.0
  - scipy>=1.13,<1.14
  - scikit-learn>=1.5,<1.6
  # 0.26 needs Python >=3.11; 0.25.2 is the newest line supporting 3.10.
  - scikit-image>=0.25.2,<0.26
  - astropy>=6.1,<7
  - matplotlib>=3.9,<3.10
  # Minor-bounded to the proven-in-use line per SECURITY.md (was major-bounded).
  - joblib>=1.5,<1.6
  # pandas backs the dashboard's data layer (aetherscan/dashboard.py). The NGC base image
  # ships it, so requirements-container.txt omits it; conda must provide it here.
  - pandas>=2.3,<2.4
  # setuptools provides pkg_resources, which blimpy (transitive via setigen)
  # imports at module load. Recent pip / Python releases dropped setuptools
  # from the bootstrap, so we install it explicitly. Upper-bound at <81 because
  # setuptools 81 removed pkg_resources as a vendored submodule -- revisit
  # once blimpy migrates off pkg_resources (upstream issue). Floor >=78.1.1 per
  # GHSA-5rjg-fvgr-3xxf (CVE-2025-47273, path traversal; fixed in 78.1.1).
  - setuptools>=78.1.1,<81
  # Conda-only deps (the NGC base image already ships h5py / psutil / pytest
  # so requirements-container.txt doesn't pin them).
  - h5py=3.11.*
  - hdf5plugin>=7.0,<7.1
  - psutil=6.0.*
  # Security floor: pytest >=9.0.3 fixes GHSA-6w46-j5rx-g56g (tmpdir handling); dev/test-only.
  - pytest>=9.0.3,<9.1
  - ipykernel
  - pip
  - pip:
      # [and-cuda] pulls nvidia-cuda-runtime-cu12 12.3.x, nvidia-cudnn-cu12 9.1.x,
      # nvidia-nccl-cu12 2.21.x, etc. -- the exact ABI the TF 2.17 wheel was built
      # against. Driver requirement: NVIDIA driver >= 525.60 on the host.
      - tensorflow[and-cuda]==2.17.*
      # tf_keras backs legacy-Keras mode (TF_USE_LEGACY_KERAS, set in aetherscan/__init__.py);
      # the v1.0.0 .keras weights are Keras-2 format (#323). The NGC container gets tf_keras from
      # its base image (so requirements-container.txt omits it), but conda/pip has no base.
      - tf_keras==2.17.*
      # Range mirrors requirements-container.txt (see the rationale there).
      - setigen>=2.7,<2.8
      - imageio>=2.37,<2.38
      - umap-learn>=0.5.6,<0.6
      # 0.50 needs Python >=3.11 AND numpy >=2; 0.49.x is upstream's last 3.10 line.
      - shap>=0.49.1,<0.50
      - slack-sdk>=3.43,<3.44
      # Floor >=1.2.2 per GHSA-mf9w-mj56-hr94 (CVE-2026-28684, set_key symlink
      # following; fixed in 1.2.2).
      - python-dotenv>=1.2.2,<2
      # Model weight distribution via the HuggingFace Hub — pin range mirrors
      # requirements-container.txt (see the rationale there).
      - huggingface_hub>=1.25.1,<1.26
      # Live monitoring dashboard (aetherscan/dashboard.py). Kept in lockstep with
      # requirements-container.txt; streamlit 1.59 coexists with TF 2.17 (protobuf 4.x)
      # and numpy<2. plotly is pure-Python.
      - streamlit>=1.59.2,<1.60
      - plotly>=6.7,<7
