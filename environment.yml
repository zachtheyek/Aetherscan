name: aetherscan
channels:
  - conda-forge
  - defaults
  - nvidia
dependencies:
  # Core Python
  - python=3.10

  # Scientific computing
  - numpy=1.23.*
  - scipy=1.11.*

  # Machine learning
  - scikit-learn=1.3.*
  - scikit-image=0.21.*

  # Astronomy
  - astropy=5.3.*

  # Visualization
  - matplotlib=3.7.*

  # Data handling
  - joblib=1.3.*
  - h5py=3.9.*

  # System monitoring
  - psutil=5.9.*

  # Testing
  - pytest=7.4.*

  # Development
  - ipykernel

  # CUDA support
  - nvidia::cuda-runtime=12.2.*
  - cudnn=8.9.*

  # Package management
  - pip
  - pip:
      # Deep learning
      - tensorflow==2.16.*

      # Signal generation
      - setigen

      # Slack integration
      - slack-sdk>=3.23.0
