name: aetherscan
channels:
  - conda-forge
  - defaults
  - nvidia
dependencies:
  - python=3.10
  - numpy=1.23.*
  - scipy=1.11.*
  - scikit-learn=1.3.*
  - scikit-image=0.21.*
  - astropy=5.3.*
  - matplotlib=3.7.*
  - joblib=1.3.*
  - h5py=3.9.*
  - psutil=5.9.*
  - pytest=7.4.*
  - ipykernel
  - nvidia::cuda-runtime=12.2.*
  - cudnn=8.9.*
  - pip
  - pip:
      - tensorflow==2.16.*
      - setigen
      - slack-sdk>=3.23.0
