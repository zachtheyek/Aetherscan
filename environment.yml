# Ampere cluster conda environment
# Version ranges should be kept in lockstep with NGC TF 25.02 container that targets
# the Blackwell cluster (see aetherscan.def + requirements-container.txt)

name: aetherscan
channels:
  - conda-forge
  - defaults
  - nvidia
dependencies:
  - python=3.10
  # Foundational deps -- pin ranges identically to requirements-container.txt
  # so the conda env and the NGC container resolve to the same versions of
  # everything aetherscan code touches directly.
  - numpy>=1.26,<2.0
  - scipy>=1.13,<1.14
  - scikit-learn>=1.5,<1.6
  - scikit-image>=0.24,<0.25
  - astropy>=6.1,<7
  - matplotlib>=3.9,<3.10
  - joblib>=1.4,<2
  # setuptools provides pkg_resources, which blimpy (transitive via setigen)
  # imports at module load. Recent pip / Python releases dropped setuptools
  # from the bootstrap, so we install it explicitly. Upper-bound at <81 because
  # setuptools 81 removed pkg_resources as a vendored submodule -- revisit
  # once blimpy migrates off pkg_resources (upstream issue).
  - setuptools>=70,<81
  # Conda-only deps (the NGC base image already ships h5py / psutil / pytest /
  # cudnn / cuda-runtime so requirements-container.txt doesn't pin them).
  - h5py=3.11.*
  - hdf5plugin
  - psutil=6.0.*
  - pytest=8.2.*
  - ipykernel
  - nvidia::cuda-runtime=12.5.*
  - cudnn=9.3.*
  - pip
  - pip:
      - tensorflow==2.17.*
      - setigen
      - imageio>=2.34,<3
      - umap-learn>=0.5.6,<0.6
      - shap>=0.46.0,<0.47
      - slack-sdk>=3.31.0,<4
      - python-dotenv>=1.0,<2
